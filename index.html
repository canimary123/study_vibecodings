<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올인원 웹 도구</title>
    
    <!-- Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons 1.11.3 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- CSS 변수를 사용한 색상 관리 --- */
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --hover-brightness: 1.1;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
        }

        .container {
            max-width: 960px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: .5rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 500;
            background-color: rgba(0,0,0,.03);
        }

        /* --- 모든 버튼에 호버 효과 추가 --- */
        .btn {
            transition: filter 0.2s ease-in-out;
        }

        .btn:hover {
            filter: brightness(var(--hover-brightness));
        }
        
        /* --- 반응형 디자인 --- */
        @media (max-width: 768px) {
            .nav-pills {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-pills .nav-link {
                text-align: center;
                border-radius: .25rem;
                margin-bottom: 0.5rem;
            }
            .tab-content {
                padding-top: 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="py-4 bg-primary text-white text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">올인원 웹 도구</h1>
            <p class="lead">당신의 생산성을 높여줄 다양한 무료 웹 도구 모음</p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row">
            <!-- 좌측 네비게이션 -->
            <div class="col-md-3">
                <ul class="nav nav-pills flex-column" id="toolTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="char-counter-tab" data-bs-toggle="pill" data-bs-target="#char-counter" type="button" role="tab"><i class="bi bi-body-text me-2"></i>글자 수 세기</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="password-generator-tab" data-bs-toggle="pill" data-bs-target="#password-generator" type="button" role="tab"><i class="bi bi-key-fill me-2"></i>비밀번호 생성기</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="qr-generator-tab" data-bs-toggle="pill" data-bs-target="#qr-generator" type="button" role="tab"><i class="bi bi-qr-code me-2"></i>QR 생성기</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="json-formatter-tab" data-bs-toggle="pill" data-bs-target="#json-formatter" type="button" role="tab"><i class="bi bi-braces me-2"></i>JSON 포맷터</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="text-converter-tab" data-bs-toggle="pill" data-bs-target="#text-converter" type="button" role="tab"><i class="bi bi-type me-2"></i>텍스트 변환기</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="yt-thumb-tab" data-bs-toggle="pill" data-bs-target="#yt-thumb" type="button" role="tab"><i class="bi bi-youtube me-2"></i>유튜브 썸네일 추출</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="image-resizer-tab" data-bs-toggle="pill" data-bs-target="#image-resizer" type="button" role="tab"><i class="bi bi-aspect-ratio me-2"></i>이미지 리사이즈</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="image-converter-tab" data-bs-toggle="pill" data-bs-target="#image-converter" type="button" role="tab"><i class="bi bi-image-alt me-2"></i>이미지 변환/압축</button>
                    </li>
                     <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pdf-extractor-tab" data-bs-toggle="pill" data-bs-target="#pdf-extractor" type="button" role="tab"><i class="bi bi-file-earmark-pdf me-2"></i>PDF 텍스트 추출</button>
                    </li>
                </ul>
            </div>

            <!-- 우측 탭 콘텐츠 -->
            <div class="col-md-9">
                <div class="tab-content" id="toolTabsContent">
                    
                    <!-- 글자 수 세기 -->
                    <div class="tab-pane fade show active" id="char-counter" role="tabpanel">
                        <div class="card">
                            <div class="card-header">글자 수 세기</div>
                            <div class="card-body">
                                <textarea id="charCounterInput" class="form-control" rows="8" placeholder="여기에 텍스트를 입력하세요..."></textarea>
                                <div class="mt-3 text-center">
                                    <span class="mx-2"><strong>공백 포함:</strong> <span id="charCountWithSpace">0</span></span>
                                    <span class="mx-2"><strong>공백 제외:</strong> <span id="charCountWithoutSpace">0</span></span>
                                    <span class="mx-2"><strong>단어 수:</strong> <span id="wordCount">0</span></span>
                                    <span class="mx-2"><strong>줄 수:</strong> <span id="lineCount">0</span></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 비밀번호 생성기 -->
                    <div class="tab-pane fade" id="password-generator" role="tabpanel">
                        <div class="card">
                            <div class="card-header">비밀번호 생성기</div>
                            <div class="card-body">
                                <div class="input-group mb-3">
                                    <input type="text" id="passwordOutput" class="form-control" placeholder="생성된 비밀번호" readonly>
                                    <button class="btn btn-outline-secondary" type="button" id="copyPasswordBtn"><i class="bi bi-clipboard"></i></button>
                                </div>
                                <div class="mb-3">
                                    <label for="passwordLength" class="form-label">길이: <span id="passwordLengthValue">16</span></label>
                                    <input type="range" class="form-range" id="passwordLength" min="8" max="64" value="16">
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeUppercase" checked>
                                    <label class="form-check-label" for="includeUppercase">대문자 (ABC...)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeLowercase" checked>
                                    <label class="form-check-label" for="includeLowercase">소문자 (abc...)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeNumbers" checked>
                                    <label class="form-check-label" for="includeNumbers">숫자 (123...)</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="includeSymbols" checked>
                                    <label class="form-check-label" for="includeSymbols">특수문자 (!@#...)</label>
                                </div>
                                <button class="btn btn-primary w-100" id="generatePasswordBtn">생성하기</button>
                            </div>
                        </div>
                    </div>

                    <!-- QR 생성기 -->
                    <div class="tab-pane fade" id="qr-generator" role="tabpanel">
                        <div class="card">
                            <div class="card-header">QR 코드 생성기</div>
                            <div class="card-body">
                                <input type="text" id="qrInput" class="form-control mb-3" placeholder="QR 코드로 만들 텍스트 또는 URL 입력">
                                <button class="btn btn-primary w-100 mb-3" id="generateQrBtn">생성하기</button>
                                <div id="qrCodeOutput" class="text-center p-3 bg-light" style="min-height: 200px;"></div>
                                <a id="downloadQrBtn" class="btn btn-success w-100 mt-3 d-none" download="qrcode.png">다운로드</a>
                            </div>
                        </div>
                    </div>

                    <!-- JSON 포맷터 -->
                    <div class="tab-pane fade" id="json-formatter" role="tabpanel">
                        <div class="card">
                            <div class="card-header">JSON 포맷터 / 압축기</div>
                            <div class="card-body">
                                <textarea id="jsonInput" class="form-control" rows="8" placeholder="JSON 데이터를 여기에 붙여넣으세요..."></textarea>
                                <div class="my-3 text-center">
                                    <button class="btn btn-primary" id="formatJsonBtn">예쁘게 만들기 (Format)</button>
                                    <button class="btn btn-secondary" id="minifyJsonBtn">압축하기 (Minify)</button>
                                    <button class="btn btn-danger" id="clearJsonBtn">지우기</button>
                                </div>
                                <textarea id="jsonOutput" class="form-control" rows="8" readonly placeholder="결과"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 텍스트 변환기 -->
                    <div class="tab-pane fade" id="text-converter" role="tabpanel">
                        <div class="card">
                            <div class="card-header">텍스트 변환기</div>
                            <div class="card-body">
                                <textarea id="textConverterInput" class="form-control" rows="6" placeholder="변환할 텍스트를 입력하세요..."></textarea>
                                <div class="my-3 d-flex flex-wrap justify-content-center gap-2">
                                    <button class="btn btn-primary" data-case="upper">UPPERCASE</button>
                                    <button class="btn btn-primary" data-case="lower">lowercase</button>
                                    <button class="btn btn-primary" data-case="sentence">Sentence case</button>
                                    <button class="btn btn-primary" data-case="capitalized">Capitalized Case</button>
                                </div>
                                <textarea id="textConverterOutput" class="form-control" rows="6" readonly placeholder="결과"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 유튜브 썸네일 추출 -->
                    <div class="tab-pane fade" id="yt-thumb" role="tabpanel">
                        <div class="card">
                            <div class="card-header">유튜브 썸네일 추출기</div>
                            <div class="card-body">
                                <input type="text" id="ytUrlInput" class="form-control mb-3" placeholder="유튜브 동영상 URL을 입력하세요">
                                <button class="btn btn-primary w-100" id="extractThumbBtn">추출하기</button>
                                <div id="ytThumbOutput" class="mt-4 text-center"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 이미지 리사이즈 -->
                    <div class="tab-pane fade" id="image-resizer" role="tabpanel">
                        <div class="card">
                            <div class="card-header">이미지 리사이저</div>
                            <div class="card-body">
                                <input class="form-control" type="file" id="imageResizerInput" accept="image/*">
                                <div class="my-3 row">
                                    <div class="col">
                                        <label for="resizeWidth" class="form-label">너비(px)</label>
                                        <input type="number" class="form-control" id="resizeWidth" placeholder="너비">
                                    </div>
                                    <div class="col">
                                        <label for="resizeHeight" class="form-label">높이(px)</label>
                                        <input type="number" class="form-control" id="resizeHeight" placeholder="높이">
                                    </div>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="keepAspectRatio" checked>
                                    <label class="form-check-label" for="keepAspectRatio">가로세로 비율 유지</label>
                                </div>
                                <button class="btn btn-primary w-100" id="resizeImageBtn">리사이즈</button>
                                <div class="mt-4 text-center">
                                    <canvas id="resizeCanvas" class="d-none"></canvas>
                                    <img id="resizedImagePreview" class="img-fluid rounded" alt="리사이즈된 이미지">
                                    <a id="downloadResizedBtn" class="btn btn-success w-100 mt-3 d-none" download="resized-image.png">다운로드</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 이미지 변환/압축 -->
                    <div class="tab-pane fade" id="image-converter" role="tabpanel">
                        <div class="card">
                            <div class="card-header">이미지 변환기 / 압축기</div>
                            <div class="card-body">
                                <input class="form-control" type="file" id="imageConverterInput" accept="image/*">
                                <div class="my-3">
                                    <label for="convertFormat" class="form-label">변환할 포맷</label>
                                    <select class="form-select" id="convertFormat">
                                        <option value="image/png">PNG</option>
                                        <option value="image/jpeg">JPEG</option>
                                        <option value="image/webp">WEBP</option>
                                    </select>
                                </div>
                                <div class="mb-3" id="qualityControl">
                                    <label for="convertQuality" class="form-label">품질: <span id="qualityValue">0.9</span></label>
                                    <input type="range" class="form-range" id="convertQuality" min="0.1" max="1" step="0.1" value="0.9">
                                </div>
                                <button class="btn btn-primary w-100" id="convertImageBtn">변환하기</button>
                                <div class="mt-4 text-center">
                                    <canvas id="convertCanvas" class="d-none"></canvas>
                                    <img id="convertedImagePreview" class="img-fluid rounded" alt="변환된 이미지">
                                    <a id="downloadConvertedBtn" class="btn btn-success w-100 mt-3 d-none">다운로드</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- PDF 텍스트 추출 -->
                    <div class="tab-pane fade" id="pdf-extractor" role="tabpanel">
                        <div class="card">
                            <div class="card-header">PDF 텍스트 추출기</div>
                            <div class="card-body">
                                <input class="form-control" type="file" id="pdfInput" accept="application/pdf">
                                <button class="btn btn-primary w-100 my-3" id="extractPdfTextBtn">텍스트 추출하기</button>
                                <div id="pdfLoadingSpinner" class="text-center d-none">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p>PDF를 처리 중입니다... (파일 크기에 따라 시간이 걸릴 수 있습니다)</p>
                                </div>
                                <textarea id="pdfOutput" class="form-control" rows="10" readonly placeholder="추출된 텍스트가 여기에 표시됩니다."></textarea>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 border-top">
        <p>&copy; 2025 올인원 웹 도구. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap 5.3.3 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- QR Code Generator Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- PDF.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        // pdf.js 워커 경로 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js`;
    </script>

    <script>
        // 모든 JavaScript 코드는 여기에 작성됩니다.
        document.addEventListener('DOMContentLoaded', () => {

            // --- 공통 헬퍼 함수 ---
            const showToast = (message, type = 'success') => {
                const toastContainer = document.createElement('div');
                toastContainer.className = `position-fixed bottom-0 end-0 p-3`;
                toastContainer.style.zIndex = 1050;
                
                const toastEl = document.createElement('div');
                toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
                toastEl.role = 'alert';
                toastEl.ariaLive = 'assertive';
                toastEl.ariaAtomic = 'true';
                
                toastEl.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                `;
                
                toastContainer.appendChild(toastEl);
                document.body.appendChild(toastContainer);
                
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
                
                toastEl.addEventListener('hidden.bs.toast', () => {
                    toastContainer.remove();
                });
            };

            // --- 1. 글자 수 세기 ---
            const charCounterInput = document.getElementById('charCounterInput');
            charCounterInput.addEventListener('input', () => {
                const text = charCounterInput.value;
                document.getElementById('charCountWithSpace').textContent = text.length;
                document.getElementById('charCountWithoutSpace').textContent = text.replace(/\s/g, '').length;
                const words = text.trim().split(/\s+/).filter(word => word.length > 0);
                document.getElementById('wordCount').textContent = words.length;
                document.getElementById('lineCount').textContent = text.split('\n').length;
            });

            // --- 2. 비밀번호 생성기 ---
            const passwordOutput = document.getElementById('passwordOutput');
            const passwordLength = document.getElementById('passwordLength');
            const passwordLengthValue = document.getElementById('passwordLengthValue');
            const generatePasswordBtn = document.getElementById('generatePasswordBtn');
            const copyPasswordBtn = document.getElementById('copyPasswordBtn');

            passwordLength.addEventListener('input', (e) => {
                passwordLengthValue.textContent = e.target.value;
            });

            generatePasswordBtn.addEventListener('click', () => {
                const length = parseInt(passwordLength.value, 10);
                const includeUppercase = document.getElementById('includeUppercase').checked;
                const includeLowercase = document.getElementById('includeLowercase').checked;
                const includeNumbers = document.getElementById('includeNumbers').checked;
                const includeSymbols = document.getElementById('includeSymbols').checked;

                const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const lower = 'abcdefghijklmnopqrstuvwxyz';
                const numbers = '0123456789';
                const symbols = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

                let charset = '';
                if (includeUppercase) charset += upper;
                if (includeLowercase) charset += lower;
                if (includeNumbers) charset += numbers;
                if (includeSymbols) charset += symbols;

                if (charset === '') {
                    showToast('하나 이상의 문자 유형을 선택해야 합니다.', 'danger');
                    return;
                }

                let password = '';
                for (let i = 0; i < length; i++) {
                    password += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                passwordOutput.value = password;
            });

            copyPasswordBtn.addEventListener('click', () => {
                if (passwordOutput.value) {
                    navigator.clipboard.writeText(passwordOutput.value)
                        .then(() => showToast('비밀번호가 복사되었습니다!'))
                        .catch(() => showToast('복사에 실패했습니다.', 'danger'));
                }
            });

            // --- 3. QR 코드 생성기 ---
            const qrInput = document.getElementById('qrInput');
            const generateQrBtn = document.getElementById('generateQrBtn');
            const qrCodeOutput = document.getElementById('qrCodeOutput');
            const downloadQrBtn = document.getElementById('downloadQrBtn');
            let qrCodeInstance = null;

            generateQrBtn.addEventListener('click', () => {
                const text = qrInput.value.trim();
                if (!text) {
                    showToast('QR 코드로 만들 텍스트를 입력하세요.', 'warning');
                    return;
                }
                
                qrCodeOutput.innerHTML = '';
                qrCodeInstance = new QRCode(qrCodeOutput, {
                    text: text,
                    width: 180,
                    height: 180,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // 다운로드 버튼 활성화
                setTimeout(() => {
                    const canvas = qrCodeOutput.querySelector('canvas');
                    if (canvas) {
                        downloadQrBtn.href = canvas.toDataURL('image/png');
                        downloadQrBtn.classList.remove('d-none');
                    }
                }, 100);
            });

            // --- 4. JSON 포맷터 ---
            const jsonInput = document.getElementById('jsonInput');
            const jsonOutput = document.getElementById('jsonOutput');
            
            document.getElementById('formatJsonBtn').addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(jsonInput.value);
                    jsonOutput.value = JSON.stringify(parsed, null, 4);
                } catch (e) {
                    jsonOutput.value = `잘못된 JSON 형식입니다: ${e.message}`;
                    showToast('잘못된 JSON 형식입니다.', 'danger');
                }
            });

            document.getElementById('minifyJsonBtn').addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(jsonInput.value);
                    jsonOutput.value = JSON.stringify(parsed);
                } catch (e) {
                    jsonOutput.value = `잘못된 JSON 형식입니다: ${e.message}`;
                    showToast('잘못된 JSON 형식입니다.', 'danger');
                }
            });
            
            document.getElementById('clearJsonBtn').addEventListener('click', () => {
                jsonInput.value = '';
                jsonOutput.value = '';
            });

            // --- 5. 텍스트 변환기 ---
            const textConverterInput = document.getElementById('textConverterInput');
            const textConverterOutput = document.getElementById('textConverterOutput');
            document.querySelector('#text-converter .card-body').addEventListener('click', (e) => {
                if (e.target.matches('button[data-case]')) {
                    const text = textConverterInput.value;
                    const caseType = e.target.dataset.case;
                    let result = '';
                    switch (caseType) {
                        case 'upper':
                            result = text.toUpperCase();
                            break;
                        case 'lower':
                            result = text.toLowerCase();
                            break;
                        case 'sentence':
                            result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
                            break;
                        case 'capitalized':
                            result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                            break;
                    }
                    textConverterOutput.value = result;
                }
            });

            // --- 6. 유튜브 썸네일 추출 ---
            const ytUrlInput = document.getElementById('ytUrlInput');
            const extractThumbBtn = document.getElementById('extractThumbBtn');
            const ytThumbOutput = document.getElementById('ytThumbOutput');

            extractThumbBtn.addEventListener('click', () => {
                const url = ytUrlInput.value;
                const videoId = extractVideoID(url);
                if (!videoId) {
                    showToast('유효한 유튜브 URL을 입력하세요.', 'danger');
                    return;
                }

                ytThumbOutput.innerHTML = `
                    <p><strong>고화질 (Max-Res):</strong></p>
                    <img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" class="img-fluid mb-2" alt="Max resolution thumbnail">
                    <a href="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" target="_blank" download class="btn btn-sm btn-outline-primary mb-3">다운로드</a>
                    
                    <p><strong>기본 화질 (SD):</strong></p>
                    <img src="https://img.youtube.com/vi/${videoId}/sddefault.jpg" class="img-fluid mb-2" alt="Standard definition thumbnail">
                    <a href="https://img.youtube.com/vi/${videoId}/sddefault.jpg" target="_blank" download class="btn btn-sm btn-outline-primary">다운로드</a>
                `;
            });

            function extractVideoID(url) {
                const regex = /(?:https? :\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/; // Added space after https? and escaped forward slashes
                const match = url.match(regex);
                return match ? match[1] : null;
            }

            // --- 7. 이미지 리사이즈 ---
            const imageResizerInput = document.getElementById('imageResizerInput');
            const resizeWidth = document.getElementById('resizeWidth');
            const resizeHeight = document.getElementById('resizeHeight');
            const keepAspectRatio = document.getElementById('keepAspectRatio');
            const resizeImageBtn = document.getElementById('resizeImageBtn');
            const resizeCanvas = document.getElementById('resizeCanvas');
            const resizedImagePreview = document.getElementById('resizedImagePreview');
            const downloadResizedBtn = document.getElementById('downloadResizedBtn');
            let originalImage = null;
            let originalWidth, originalHeight;

            imageResizerInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        originalWidth = originalImage.width;
                        originalHeight = originalImage.height;
                        resizeWidth.value = originalWidth;
                        resizeHeight.value = originalHeight;
                        resizedImagePreview.src = event.target.result;
                        downloadResizedBtn.classList.add('d-none');
                    };
                    originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            resizeWidth.addEventListener('input', () => {
                if (keepAspectRatio.checked && originalImage) {
                    const aspectRatio = originalHeight / originalWidth;
                    resizeHeight.value = Math.round(resizeWidth.value * aspectRatio);
                }
            });

            resizeHeight.addEventListener('input', () => {
                if (keepAspectRatio.checked && originalImage) {
                    const aspectRatio = originalWidth / originalHeight;
                    resizeWidth.value = Math.round(resizeHeight.value * aspectRatio);
                }
            });

            resizeImageBtn.addEventListener('click', () => {
                if (!originalImage) {
                    showToast('먼저 이미지를 선택하세요.', 'warning');
                    return;
                }
                
                const btnOriginalText = resizeImageBtn.innerHTML;
                resizeImageBtn.disabled = true;
                resizeImageBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 리사이징 중...';

                const width = parseInt(resizeWidth.value, 10);
                const height = parseInt(resizeHeight.value, 10);

                resizeCanvas.width = width;
                resizeCanvas.height = height;
                const ctx = resizeCanvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0, width, height);

                const dataUrl = resizeCanvas.toDataURL('image/png');
                resizedImagePreview.src = dataUrl;
                downloadResizedBtn.href = dataUrl;
                downloadResizedBtn.classList.remove('d-none');
                
                resizeImageBtn.disabled = false;
                resizeImageBtn.innerHTML = btnOriginalText;
            });

            // --- 8. 이미지 변환기 / 압축기 ---
            const imageConverterInput = document.getElementById('imageConverterInput');
            const convertFormat = document.getElementById('convertFormat');
            const convertQuality = document.getElementById('convertQuality');
            const qualityValue = document.getElementById('qualityValue');
            const qualityControl = document.getElementById('qualityControl');
            const convertImageBtn = document.getElementById('convertImageBtn');
            const convertCanvas = document.getElementById('convertCanvas');
            const convertedImagePreview = document.getElementById('convertedImagePreview');
            const downloadConvertedBtn = document.getElementById('downloadConvertedBtn');
            let converterImage = null;

            imageConverterInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    converterImage = new Image();
                    converterImage.onload = () => {
                        convertedImagePreview.src = event.target.result;
                        downloadConvertedBtn.classList.add('d-none');
                    };
                    converterImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            convertFormat.addEventListener('change', () => {
                qualityControl.style.display = convertFormat.value === 'image/jpeg' || convertFormat.value === 'image/webp' ? 'block' : 'none';
            });

            convertQuality.addEventListener('input', (e) => {
                qualityValue.textContent = e.target.value;
            });

            convertImageBtn.addEventListener('click', () => {
                if (!converterImage) {
                    showToast('먼저 이미지를 선택하세요.', 'warning');
                    return;
                }
                
                const btnOriginalText = convertImageBtn.innerHTML;
                convertImageBtn.disabled = true;
                convertImageBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 변환 중...';

                convertCanvas.width = converterImage.width;
                convertCanvas.height = converterImage.height;
                const ctx = convertCanvas.getContext('2d');
                ctx.drawImage(converterImage, 0, 0);

                const format = convertFormat.value;
                const quality = parseFloat(convertQuality.value);
                const dataUrl = convertCanvas.toDataURL(format, quality);

                convertedImagePreview.src = dataUrl;
                downloadConvertedBtn.href = dataUrl;
                const extension = format.split('/')[1];
                downloadConvertedBtn.download = `converted-image.${extension}`;
                downloadConvertedBtn.classList.remove('d-none');
                
                convertImageBtn.disabled = false;
                convertImageBtn.innerHTML = btnOriginalText;
            });

            // --- 9. PDF 텍스트 추출기 ---
            const pdfInput = document.getElementById('pdfInput');
            const extractPdfTextBtn = document.getElementById('extractPdfTextBtn');
            const pdfOutput = document.getElementById('pdfOutput');
            const pdfLoadingSpinner = document.getElementById('pdfLoadingSpinner');

            extractPdfTextBtn.addEventListener('click', () => {
                const file = pdfInput.files[0];
                if (!file) {
                    showToast('PDF 파일을 선택해주세요.', 'warning');
                    return;
                }

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const typedarray = new Uint8Array(e.target.result);
                    
                    pdfOutput.value = '';
                    pdfLoadingSpinner.classList.remove('d-none');
                    extractPdfTextBtn.disabled = true;

                    try {
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                        }
                        pdfOutput.value = fullText;
                        showToast('텍스트 추출 완료!', 'success');
                    } catch (error) {
                        console.error('PDF 처리 오류:', error);
                        pdfOutput.value = '오류: PDF 파일에서 텍스트를 추출할 수 없습니다. 암호화되었거나 손상된 파일일 수 있습니다.';
                        showToast('PDF 처리 중 오류가 발생했습니다.', 'danger');
                    } finally {
                        pdfLoadingSpinner.classList.add('d-none');
                        extractPdfTextBtn.disabled = false;
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        });
    </script>
</body>
</html>
