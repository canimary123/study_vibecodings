<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolKit Pro - 올인원 스마트 도구</title>

    <!-- Bootstrap 5.3.3 CSS CDN (for Grid and Utilities) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Pretendard Font CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        /* --- 🎨 디자인 시스템 (필수 준수) --- */

        /* 컬러 팔레트 */
        :root {
            /* Primary Colors */
            --primary-purple: #7C3AED;
            --primary-pink: #EC4899;
            --primary-blue: #3B82F6;
            
            /* Gradient Backgrounds */
            --bg-gradient: linear-gradient(135deg, #faf5ff 0%, #fce7f3 50%, #eff6ff 100%);
            --card-gradient: linear-gradient(135deg, #faf5ff 0%, #fce7f3 100%);
            --hero-gradient: linear-gradient(90deg, #7C3AED 0%, #EC4899 100%);
            
            /* Neutral Colors */
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            
            /* Semantic Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        /* 모든 전환 효과 */
        * {
            transition: all 0.3s ease;
        }

        /* Body 기본 스타일 */
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--gray-700);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* 타이포그래피 */
        h1.brand-title { 
            font-size: 1.5rem; 
            font-weight: 800; 
            background: var(--hero-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        h2.tool-title { 
            font-size: 1.75rem; 
            font-weight: 700; 
            color: var(--gray-800); 
            margin-bottom: 2rem;
        }
        h3 { font-size: 1.25rem; font-weight: 600; color: var(--gray-700); }

        /* 메인 도구 카드 */
        .main-tool-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: var(--shadow-xl);
        }
        @media (min-width: 768px) {
            .main-tool-card {
                padding: 3rem;
            }
        }

        /* 입력 필드 스타일 */
        .form-control-custom {
            border: 2px solid var(--gray-200);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            width: 100%;
            background-color: var(--gray-50);
            color: var(--gray-800);
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            background-color: white;
        }
        
        textarea.form-control-custom {
            min-height: 120px;
        }

        /* 버튼 스타일 */
        .btn-custom {
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }

        .btn-primary-custom {
            background: var(--hero-gradient);
            color: white;
        }

        .btn-primary-custom:hover {
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
            color: white;
        }
        
        .btn-secondary-custom {
            background: white;
            color: var(--primary-purple);
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--primary-purple);
            font-weight: 600;
        }

        .btn-secondary-custom:hover {
            background: #faf5ff;
            transform: translateY(-2px);
        }

        /* 도구 탭 네비게이션 */
        .tool-tab {
            background: rgba(255,255,255,0.6);
            color: var(--gray-600);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tool-tab.active {
            background: white;
            color: var(--primary-purple);
            box-shadow: var(--shadow-md);
        }
        .tool-tab .hot-badge {
            background: var(--error);
            color: white;
            padding: 0.125rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        /* 비밀번호 생성기 옵션 버튼 */
        .preset-btn {
            width: 100%;
            padding: 1rem;
            background: #faf5ff;
            color: var(--primary-purple);
            border: 2px solid transparent;
            border-radius: 0.75rem;
            font-weight: 600;
        }
        .preset-btn.active, .preset-btn:hover {
            background: white;
            border-color: var(--primary-purple);
            box-shadow: var(--shadow-sm);
        }

        /* 강도 바 */
        .strength-bar-container {
            height: 0.75rem;
            background: var(--gray-200);
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--warning), var(--success));
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- 1. 헤더 (Sticky) -->
    <header style="position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); padding: 1rem 0;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <span style="font-size: 1.75rem;">⚡</span>
                    <h1 class="brand-title">ToolKit Pro</h1>
                </div>
                <div class="d-none d-md-flex gap-4">
                    <div class="d-flex align-items-center gap-2">
                        <span style="color: var(--error);">❤️</span>
                        <span style="color: var(--gray-600); font-size: 0.875rem;">12,847 사용자</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span style="font-size: 1.2rem;">📤</span>
                        <span id="shareCounter" style="color: var(--gray-600); font-size: 0.875rem;">0 공유</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <!-- 2. 히어로 배너 (바이럴 요소) -->
        <div style="background: var(--hero-gradient); border-radius: 1.5rem; padding: 2.5rem; margin: 2rem 0; box-shadow: var(--shadow-xl);">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span style="font-size: 1.5rem;">📈</span>
                        <span style="color: white; font-weight: 600;">🔥 실시간 인기</span>
                    </div>
                    <h2 style="color: white; font-size: 2rem; margin-bottom: 0.5rem; font-weight: 700;">오늘만 1,247명이 사용중!</h2>
                    <p style="color: rgba(255,255,255,0.9);">친구에게 공유하고 프리미엄 기능 무료로 받기</p>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <button class="btn-secondary-custom" style="background: white; color: var(--primary-purple);" onclick="shareApp()">지금 공유하기 →</button>
                </div>
            </div>
        </div>

        <!-- 3. 도구 탭 네비게이션 -->
        <div id="toolTabsContainer" class="d-flex gap-3 mb-4 overflow-auto pb-2">
            <!-- JS로 동적 생성 -->
        </div>

        <!-- 5. 메인 도구 카드 -->
        <div id="toolContent">
            <!-- JS로 활성 도구 렌더링 -->
        </div>

        <!-- 4. 광고 영역 (AdSense 위치) -->
        <div style="background: var(--gray-100); border: 2px dashed var(--gray-200); border-radius: 1rem; padding: 2rem; text-align: center; margin: 2rem 0;">
            <p style="color: #9ca3af; margin: 0; font-weight: 500;">Google AdSense 광고 영역</p>
        </div>

        <!-- 9. 관련 도구 추천 -->
        <div style="background: white; border-radius: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg); margin-top: 2rem;">
            <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">🔥 지금 핫한 도구</h3>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="related-tool-card" data-tool="qr">
                        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📱</div>
                        <h4 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; color: var(--gray-800);">QR코드 생성기</h4>
                        <p style="color: var(--gray-600); font-size: 0.875rem; margin: 0;">2.3k 명이 사용중</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="related-tool-card" data-tool="json">
                        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📄</div>
                        <h4 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; color: var(--gray-800);">JSON 포맷터</h4>
                        <p style="color: var(--gray-600); font-size: 0.875rem; margin: 0;">1.8k 명이 사용중</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="related-tool-card" data-tool="image-resize">
                        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">✂️</div>
                        <h4 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; color: var(--gray-800);">이미지 리사이저</h4>
                        <p style="color: var(--gray-600); font-size: 0.875rem; margin: 0;">3.1k 명이 사용중</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 10. 푸터 CTA -->
        <div style="background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple)); border-radius: 1.5rem; padding: 3rem; text-align: center; margin-top: 3rem; margin-bottom: 2rem;">
            <h3 style="color: white; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem;">💎 프리미엄으로 업그레이드</h3>
            <p style="color: rgba(255,255,255,0.9); margin-bottom: 1.5rem;">광고 없이, 무제한으로 모든 도구를 사용하세요</p>
            <button class="btn-secondary-custom" style="background: white; color: var(--primary-purple); padding: 1rem 2.5rem; font-size: 1rem;" onmouseover="this.style.boxShadow='0 20px 25px rgba(255,255,255,0.3)'">월 4,900원 시작하기</button>
        </div>
    </main>
    
    <footer class="text-center py-4">
        <p style="color: var(--gray-600); font-size: 0.875rem;">&copy; 2025 ToolKit Pro. All Rights Reserved.</p>
    </footer>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js`;
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- ⚙️ 앱 상태 및 설정 ---
        const state = {
            currentTool: 'password',
            shareCount: 0,
        };

        const tools = {
            'password': { name: '비밀번호 생성기', icon: '🔒', hot: true, render: renderPasswordGenerator },
            'image-convert': { name: '이미지 변환', icon: '🖼️', render: renderImageConverter },
            'image-resize': { name: '이미지 리사이즈', icon: '✂️', render: renderImageResizer },
            'text-convert': { name: '텍스트 변환기', icon: '✏️', render: renderTextConverter },
            'qr': { name: 'QR코드 생성기', icon: '📱', render: renderQRGenerator },
            'char-count': { name: '글자수 세기', icon: '🧮', render: renderCharCounter },
            'youtube': { name: '유튜브 썸네일', icon: '📺', render: renderYoutubeExtractor },
            'json': { name: 'JSON 포맷터', icon: '📄', render: renderJsonFormatter },
            'pdf': { name: 'PDF 텍스트 추출', icon: '📑', render: renderPdfExtractor }
        };

        const toolTabsContainer = document.getElementById('toolTabsContainer');
        const toolContent = document.getElementById('toolContent');

        // --- 🖼️ 렌더링 함수 ---

        function renderTabs() {
            toolTabsContainer.innerHTML = '';
            for (const [key, tool] of Object.entries(tools)) {
                const tab = document.createElement('button');
                tab.className = `tool-tab ${state.currentTool === key ? 'active' : ''}`;
                tab.dataset.tool = key;
                tab.innerHTML = `${tool.icon} ${tool.name} ${tool.hot ? '<span class="hot-badge">HOT</span>' : ''}`;
                toolTabsContainer.appendChild(tab);
            }
        }

        function renderTool() {
            const tool = tools[state.currentTool];
            if (tool && tool.render) {
                tool.render();
            }
        }
        
        // --- 헬퍼 함수 ---
        function setButtonLoading(button, isLoading, loadingText = '처리 중...') {
            if (isLoading) {
                button.disabled = true;
                button.dataset.originalText = button.innerHTML;
                button.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ${loadingText}`;
            } else {
                button.disabled = false;
                button.innerHTML = button.dataset.originalText;
            }
        }

        function createFileDropZone(input, onFile) {
            const dropZone = input.parentElement;
            dropZone.addEventListener('click', () => input.click());
            dropZone.addEventListener('dragover', e => {
                e.preventDefault();
                dropZone.classList.add('active');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.classList.remove('active');
                if (e.dataTransfer.files.length) {
                    onFile(e.dataTransfer.files[0]);
                }
            });
            input.addEventListener('change', e => {
                if (e.target.files.length) {
                    onFile(e.target.files[0]);
                }
            });
        }

        // --- 🔨 각 도구별 렌더링 및 로직 ---

        // 1. 비밀번호 생성기
        function renderPasswordGenerator() {
            toolContent.innerHTML = `
                <div class="main-tool-card">
                    <h2 class="tool-title">🔒 최강 비밀번호 생성기</h2>
                    <div class="mb-4">
                        <label class="form-label-custom">사이트 종류 선택</label>
                        <div class="row g-3" id="passwordPresets">
                            <div class="col-6 col-md-3"><button class="preset-btn active" data-preset="general">🌐 일반</button></div>
                            <div class="col-6 col-md-3"><button class="preset-btn" data-preset="bank">🏦 은행</button></div>
                            <div class="col-6 col-md-3"><button class="preset-btn" data-preset="sns">📱 SNS</button></div>
                            <div class="col-6 col-md-3"><button class="preset-btn" data-preset="shopping">🛍️ 쇼핑몰</button></div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label-custom d-flex justify-content-between"><span>길이: <span id="pwLengthLabel">16</span></span></label>
                        <input type="range" class="form-range" id="pwLength" min="8" max="64" value="16">
                    </div>
                    <div class="result-box">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="result-label">생성된 비밀번호</span>
                            <span class="strength-label">보안 강도: <span id="strengthPercent">0%</span></span>
                        </div>
                        <div class="d-flex gap-3">
                            <input type="text" id="pwOutput" readonly class="form-control-custom" style="font-family: 'Courier New', monospace; font-size: 1.125rem;">
                            <button id="copyPwBtn" class="btn-icon"><span style="font-size: 1.5rem;">📋</span></button>
                        </div>
                    </div>
                    <div class="strength-bar-container mt-3"><div id="strengthBar" class="strength-bar"></div></div>
                    <div class="d-flex gap-3 mt-4">
                        <button id="generatePwBtn" class="btn-custom btn-primary-custom flex-grow-1">🔄 새로 생성하기</button>
                        <button onclick="shareApp()" class="btn-custom" style="background: var(--primary-blue); color: white; padding: 1rem 1.5rem;">📤 공유</button>
                    </div>
                </div>
            `;
            setupPasswordGeneratorLogic();
        }

        function setupPasswordGeneratorLogic() {
            const presets = {
                general: { len: 16, upper: true, lower: true, num: true, sym: true },
                bank: { len: 12, upper: true, lower: true, num: true, sym: false },
                sns: { len: 20, upper: true, lower: true, num: true, sym: false },
                shopping: { len: 14, upper: true, lower: true, num: true, sym: true }
            };
            let currentConfig = { ...presets.general };
            const lengthSlider = document.getElementById('pwLength');
            const lengthLabel = document.getElementById('pwLengthLabel');
            const output = document.getElementById('pwOutput');
            const strengthBar = document.getElementById('strengthBar');
            const strengthPercent = document.getElementById('strengthPercent');

            const updateLengthLabel = () => lengthLabel.textContent = lengthSlider.value;
            lengthSlider.addEventListener('input', () => { updateLengthLabel(); generatePassword(); });

            document.getElementById('passwordPresets').addEventListener('click', e => {
                if (e.target.tagName === 'BUTTON') {
                    const preset = e.target.dataset.preset;
                    document.querySelectorAll('#passwordPresets .preset-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentConfig = { ...presets[preset] };
                    lengthSlider.value = currentConfig.len;
                    updateLengthLabel();
                    generatePassword();
                }
            });

            document.getElementById('generatePwBtn').addEventListener('click', generatePassword);
            document.getElementById('copyPwBtn').addEventListener('click', () => {
                if (output.value) navigator.clipboard.writeText(output.value).then(() => showToast('✅ 비밀번호가 복사되었습니다!'));
            });

            function generatePassword() {
                const chars = {
                    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower: 'abcdefghijklmnopqrstuvwxyz',
                    num: '0123456789', sym: '!@#$%^&*()_+-=[]{}|;:,.<>?'
                };
                let charset = Object.keys(chars).filter(k => currentConfig[k]).map(k => chars[k]).join('');
                let password = '';
                for (let i = 0; i < lengthSlider.value; i++) {
                    password += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                output.value = password;
                updateStrength();
            }

            function updateStrength() {
                let score = 0;
                const value = output.value;
                if (value.length >= 12) score += 25;
                if (value.length >= 16) score += 15;
                if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score += 25;
                if (/\d/.test(value)) score += 20;
                if (/[^A-Za-z0-9]/.test(value)) score += 15;
                score = Math.min(100, score);
                strengthPercent.textContent = `${score}%`;
                strengthBar.style.width = `${score}%`;
                if (score < 40) strengthBar.style.background = 'var(--error)';
                else if (score < 75) strengthBar.style.background = 'var(--warning)';
                else strengthBar.style.background = 'linear-gradient(90deg, var(--warning), var(--success))';
            }
            generatePassword();
        }

        // 2. 이미지 변환기
        function renderImageConverter() {
            toolContent.innerHTML = `
                <div class="main-tool-card">
                    <h2 class="tool-title">🖼️ 이미지 변환/압축</h2>
                    <div class="file-drop-zone mb-4">
                        <input type="file" id="imageConverterInput" class="file-input" accept="image/*">
                        <div class="file-drop-message">
                            <div style="font-size: 2rem;">📤</div>
                            <p class="mb-0 fw-bold">여기에 파일을 드래그하거나 클릭하여 업로드</p>
                            <small class="text-muted">PNG, JPG, WEBP 등 지원</small>
                        </div>
                    </div>
                    <div id="imageConvertPreview" class="text-center mb-4"></div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label-custom">변환할 포맷</label>
                            <select id="convertFormat" class="form-control-custom">
                                <option value="image/png">PNG</option>
                                <option value="image/jpeg">JPEG</option>
                                <option value="image/webp">WEBP</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="qualityControl" style="display:none;">
                            <label class="form-label-custom">품질: <span id="qualityValue">0.9</span></label>
                            <input type="range" class="form-range" id="convertQuality" min="0.1" max="1" step="0.1" value="0.9">
                        </div>
                    </div>
                    <button id="convertImageBtn" class="btn-custom btn-primary-custom w-100" disabled>변환하기</button>
                    <div id="convertResult" class="mt-4"></div>
                </div>`;
            setupImageConverterLogic();
        }

        function setupImageConverterLogic() {
            const input = document.getElementById('imageConverterInput');
            const previewContainer = document.getElementById('imageConvertPreview');
            const convertBtn = document.getElementById('convertImageBtn');
            const resultContainer = document.getElementById('convertResult');
            const formatSelect = document.getElementById('convertFormat');
            const qualityControl = document.getElementById('qualityControl');
            const qualitySlider = document.getElementById('convertQuality');
            const qualityValue = document.getElementById('qualityValue');
            let originalImage = null, originalFileName = '';

            createFileDropZone(input, file => {
                if (!file.type.startsWith('image/')) return showToast('이미지 파일만 업로드할 수 있습니다.', 'error');
                originalFileName = file.name.split('.').slice(0, -1).join('.');
                const reader = new FileReader();
                reader.onload = e => {
                    previewContainer.innerHTML = `<img src="${e.target.result}" class="img-fluid rounded" style="max-height: 200px;">`;
                    originalImage = new Image();
                    originalImage.src = e.target.result;
                    originalImage.onload = () => convertBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            });

            formatSelect.addEventListener('change', () => qualityControl.style.display = formatSelect.value === 'image/png' ? 'none' : 'block');
            qualitySlider.addEventListener('input', () => qualityValue.textContent = qualitySlider.value);

            convertBtn.addEventListener('click', () => {
                if (!originalImage) return;
                setButtonLoading(convertBtn, true, '변환 중...');
                const canvas = document.createElement('canvas');
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                canvas.getContext('2d').drawImage(originalImage, 0, 0);
                const format = formatSelect.value;
                const quality = parseFloat(qualitySlider.value);
                const dataUrl = canvas.toDataURL(format, format === 'image/png' ? undefined : quality);
                const extension = format.split('/')[1];
                resultContainer.innerHTML = `<div class="result-box text-center"><h3 class="h5 mb-3">변환 완료!</h3><img src="${dataUrl}" class="img-fluid rounded my-3" style="max-height: 200px;"><a href="${dataUrl}" download="${originalFileName}.${extension}" class="btn-custom btn-secondary-custom w-100">다운로드</a></div>`;
                setButtonLoading(convertBtn, false, '변환하기');
            });
        }

        // 3. 이미지 리사이저
        function renderImageResizer() {
            toolContent.innerHTML = `

                        <div class="col-md-5"><label class="form-label-custom">너비(px)</label><input type="number" id="resizeWidth" class="form-control-custom"></div>
                        <div class="col-md-2 d-flex align-items-end justify-content-center fs-4">x</div>
                        <div class="col-md-5"><label class="form-label-custom">높이(px)</label><input type="number" id="resizeHeight" class="form-control-custom"></div>
                    </div>
                    <div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" id="keepAspectRatio" checked><label class="form-check-label" for="keepAspectRatio">가로세로 비율 유지</label></div>
                    <button id="resizeImageBtn" class="btn-custom btn-primary-custom w-100" disabled>리사이즈</button>
                    <div id="resizeResult" class="mt-4"></div>
                </div>`;
            setupImageResizerLogic();
        }

        function setupImageResizerLogic() {
            const input = document.getElementById('imageResizerInput');
            const previewContainer = document.getElementById('imageResizePreview');
            const resizeBtn = document.getElementById('resizeImageBtn');
            const resultContainer = document.getElementById('resizeResult');
            const widthInput = document.getElementById('resizeWidth');
            const heightInput = document.getElementById('resizeHeight');
            const keepAspectRatio = document.getElementById('keepAspectRatio');
            let originalImage = null, originalFileName = '', aspectRatio = 1;

            createFileDropZone(input, file => {
                if (!file.type.startsWith('image/')) return showToast('이미지 파일만 업로드할 수 있습니다.', 'error');
                originalFileName = file.name.split('.').slice(0, -1).join('.');
                const reader = new FileReader();
                reader.onload = e => {
                    previewContainer.innerHTML = `<img src="${e.target.result}" class="img-fluid rounded" style="max-height: 200px;">`;
                    originalImage = new Image();
                    originalImage.src = e.target.result;
                    originalImage.onload = () => {
                        widthInput.value = originalImage.width;
                        heightInput.value = originalImage.height;
                        aspectRatio = originalImage.width / originalImage.height;
                        resizeBtn.disabled = false;
                    };
                };
                reader.readAsDataURL(file);
            });

            widthInput.addEventListener('input', () => { if (keepAspectRatio.checked) heightInput.value = Math.round(widthInput.value / aspectRatio) });
            heightInput.addEventListener('input', () => { if (keepAspectRatio.checked) widthInput.value = Math.round(heightInput.value * aspectRatio) });

            resizeBtn.addEventListener('click', () => {
                if (!originalImage) return;
                setButtonLoading(resizeBtn, true, '리사이징 중...');
                const width = parseInt(widthInput.value);
                const height = parseInt(heightInput.value);
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(originalImage, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/png');
                resultContainer.innerHTML = `<div class="result-box text-center"><h3 class="h5 mb-3">리사이즈 완료!</h3><img src="${dataUrl}" class="img-fluid rounded my-3" style="max-height: 200px;"><a href="${dataUrl}" download="${originalFileName}-resized.png" class="btn-custom btn-secondary-custom w-100">다운로드</a></div>`;
                setButtonLoading(resizeBtn, false, '리사이즈');
            });
        }

        // 4. 텍스트 변환기
        function renderTextConverter() {
            toolContent.innerHTML = `
                <div class="main-tool-card">
                    <h2 class="tool-title">✏️ 텍스트 변환기</h2>
                    <textarea id="textConverterInput" class="form-control-custom mb-3" rows="5" placeholder="변환할 텍스트를 입력하세요..."></textarea>
                    <div class="d-flex flex-wrap gap-2 justify-content-center my-4" id="textConvertButtons">
                        <button class="btn-secondary-custom" data-case="upper">UPPERCASE</button>
                        <button class="btn-secondary-custom" data-case="lower">lowercase</button>
                        <button class="btn-secondary-custom" data-case="capitalized">Capitalized</button>
                        <button class="btn-secondary-custom" data-case="urlencode">URL Encode</button>
                        <button class="btn-secondary-custom" data-case="urldecode">URL Decode</button>
                    </div>
                    <textarea id="textConverterOutput" class="form-control-custom" rows="5" readonly placeholder="결과"></textarea>
                </div>`;
            setupTextConverterLogic();
        }

        function setupTextConverterLogic() {
            const input = document.getElementById('textConverterInput');
            const output = document.getElementById('textConverterOutput');
            document.getElementById('textConvertButtons').addEventListener('click', e => {
                if (e.target.tagName !== 'BUTTON') return;
                const text = input.value;
                let result = '';
                try {
                    switch (e.target.dataset.case) {
                        case 'upper': result = text.toUpperCase(); break;
                        case 'lower': result = text.toLowerCase(); break;
                        case 'capitalized': result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); break;
                        case 'urlencode': result = encodeURIComponent(text); break;
                        case 'urldecode': result = decodeURIComponent(text); break;
                    }
                    output.value = result;
                } catch (err) {
                    output.value = '오류: ' + err.message;
                    showToast('변환 중 오류가 발생했습니다.', 'error');
                }
            });
        }

        function setupQRGeneratorLogic() {
            const input = document.getElementById('qrInput');

            const outputDiv = document.getElementById('qrCodeOutput');

            const downloadBtn = document.getElementById('downloadQrBtn');

        function renderCharCounter() {
            toolContent.innerHTML = `
                <div class="main-tool-card">

                    <textarea id="charCounterInput" class="form-control-custom" rows="8" placeholder="여기에 텍스트를 입력하여 글자 수를 확인하세요..."></textarea>
                    <div id="charCounts" class="d-flex flex-wrap justify-content-center gap-4 text-center mt-4"></div>

        function setupCharCounterLogic() {

                const text = input.value;
                const counts = {
                    '공백 포함': text.length,

        // 7. 유튜브 썸네일 추출
        function renderYoutubeExtractor() {
            toolContent.innerHTML = `
                <div class="main-tool-card">

        function renderJsonFormatter() {
            toolContent.innerHTML = `
                <div class="main-tool-card">
                    <h2 class="tool-title">📄 JSON 포맷터</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label-custom">입력</label>
                            <textarea id="jsonInput" class="form-control-custom" rows="10" placeholder="JSON 데이터를 여기에 붙여넣으세요..."></textarea>

                        <div class="col-md-6">

                    <div class="d-flex gap-3 mt-4">
                        <button id="formatJsonBtn" class="btn-custom btn-primary-custom flex-grow-1">예쁘게</button>

        function setupJsonFormatterLogic() {
            const input = document.getElementById('jsonInput');
            const output = document.getElementById('jsonOutput');
            const format = (minify) => {
                try {
                    output.value = JSON.stringify(JSON.parse(input.value), null, minify ? 0 : 4);

                    showToast('잘못된 JSON 형식입니다.', 'error');
                }
            };
            document.getElementById('formatJsonBtn').addEventListener('click', () => format(false));
            document.getElementById('minifyJsonBtn').addEventListener('click', () => format(true));
        }

        // 9. PDF 텍스트 추출
        function renderPdfExtractor() {
            toolContent.innerHTML = `
                <div class="main-tool-card">
                    <h2 class="tool-title">📑 PDF 텍스트 추출</h2>
                    <div class="file-drop-zone mb-4">
                        <input type="file" id="pdfInput" class="file-input" accept="application/pdf">
                        <div class="file-drop-message">
                            <div style="font-size: 2rem;">📤</div>
                            <p class="mb-0 fw-bold">PDF 파일을 드래그하거나 클릭하여 업로드</p>
                        </div>
                    </div>
                    <button id="extractPdfTextBtn" class="btn-custom btn-primary-custom w-100" disabled>텍스트 추출하기</button>
                    <div id="pdfResult" class="mt-4"></div>
                </div>`;
            setupPdfExtractorLogic();
        }

        function setupPdfExtractorLogic() {
            const input = document.getElementById('pdfInput');
            const extractBtn = document.getElementById('extractPdfTextBtn');
            const resultContainer = document.getElementById('pdfResult');
            let pdfFile = null;

            createFileDropZone(input, file => {
                if (file.type !== 'application/pdf') return showToast('PDF 파일만 업로드할 수 있습니다.', 'error');
                pdfFile = file;
                extractBtn.disabled = false;
                showToast(`'${file.name}' 파일이 선택되었습니다.`, 'success');
            });

            extractBtn.addEventListener('click', async () => {
                if (!pdfFile) return;
                setButtonLoading(extractBtn, true, '추출 중...');
                const reader = new FileReader();
                reader.onload = async e => {
                    try {
                        const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise;
                        let text = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            text += content.items.map(item => item.str).join(' ') + '\n';
                        }
                        resultContainer.innerHTML = `<div class="result-box"><h3 class="h5">추출 완료</h3><textarea class="form-control-custom mt-3" rows="10" readonly>${text}</textarea></div>`;
                    } catch (err) {
                        showToast('PDF 처리 중 오류 발생', 'error');
                    } finally {
                        setButtonLoading(extractBtn, false, '텍스트 추출하기');
                    }
                };
                reader.readAsArrayBuffer(pdfFile);
            });
        }

        init();

    // --- 🌐 전역 헬퍼 함수 ---
    function showToast(message, type = 'success') {
        const toastId = 'toast-' + Date.now();
        const toastContainer = document.createElement('div');
        toastContainer.id = toastId;
        toastContainer.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 2000;';
        
        const toastEl = document.createElement('div');
        toastEl.style.cssText = `
            background: ${type === 'success' ? 'var(--success)' : 'var(--error)'};
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: var(--shadow-lg);
            font-weight: 600;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        `;
        toastEl.textContent = message;
        toastContainer.appendChild(toastEl);
        document.body.appendChild(toastContainer);

        setTimeout(() => {
            toastEl.style.opacity = '1';
            toastEl.style.transform = 'translateX(0)';
        }, 10);

        setTimeout(() => {
            toastEl.style.opacity = '0';
            toastEl.style.transform = 'translateX(100%)';
            setTimeout(() => document.getElementById(toastId)?.remove(), 500);
        }, 3000);
    }

    function shareApp() {
        const shareData = {
            title: 'ToolKit Pro',
            text: '정말 멋진 올인원 웹 도구를 발견했어요! 완전 무료!',
            url: window.location.href
        };
        if (navigator.share) {
            navigator.share(shareData)
            .then(() => {
                showToast('💜 공유해주셔서 감사합니다!');
                const counter = document.getElementById('shareCounter');
                let currentCount = parseInt(counter.textContent.split(' ')[0]);
                counter.textContent = `${currentCount + 1} 공유`;
            })
            .catch(console.error);
        } else {
            navigator.clipboard.writeText(shareData.url).then(() => {
                showToast('✅ 링크가 복사되었습니다. 친구에게 공유해주세요!');
            });
        }
    }
