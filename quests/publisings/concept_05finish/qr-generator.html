  <script>
    function generateQR() {
      const text = document.getElementById('qrText').value;
      if (!text) {
        alert('텍스트를 입력하세요');
        return;
      }
      
      const qrResult = document.getElementById('qrResult');
      qrResult.innerHTML = '';
      
      new QRCode(qrResult, {
        text: text,
        width: 256,
        height: 256,
        colorDark: '#7C3AED',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      qrResult.style.display = 'inline-block';
    }
  </script>
