  <script>
    let resizeImageObj = null;
    let originalFileType = 'png';

    function loadResizeImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      originalFileType = file.type.split('/')[1] || 'png';

      const reader = new FileReader();
      reader.onload = function(e) {
        resizeImageObj = new Image();
        resizeImageObj.src = e.target.result;
        resizeImageObj.onload = function() {
          document.getElementById('resizePreviewImg').src = e.target.result;
          document.getElementById('resizePreview').style.display = 'block';
          document.getElementById('resizeWidth').value = resizeImageObj.width;
          document.getElementById('resizeHeight').value = resizeImageObj.height;
        };
      };
      reader.readAsDataURL(file);
    }

    function resizeImage() {
      if (!resizeImageObj) {
        alert('이미지를 먼저 선택하세요');
        return;
      }
      
      const newWidth = parseInt(document.getElementById('resizeWidth').value);
      const newHeight = parseInt(document.getElementById('resizeHeight').value);

      if (!newWidth || !newHeight || newWidth <= 0 || newHeight <= 0) {
        alert('유효한 너비와 높이를 입력하세요.');
        return;
      }
      
      const canvas = document.createElement('canvas');
      canvas.width = newWidth;
      canvas.height = newHeight;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(resizeImageObj, 0, 0, newWidth, newHeight);
      
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'resized.' + originalFileType;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('리사이즈 완료!');
      }, 'image/' + originalFileType);
    }
  </script>
