  <script>
    async function convertToPDF() {
      const text = document.getElementById('pdfInput').value;
      if (!text) {
        alert('텍스트를 입력하세요');
        return;
      }
      
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Noto Sans KR 폰트 추가 (Base64)
      // 이 부분은 실제로는 폰트 파일을 서버에 두고 fetch로 가져오는 것이 좋습니다.
      // 여기서는 예시로 비워두지만, 한글 폰트가 없으면 글자가 깨집니다.
      // doc.addFont('NotoSansKR-Regular.ttf', 'NotoSansKR', 'normal');
      // doc.setFont('NotoSansKR');
      
      // 일단 jsPDF 기본 폰트로 시도합니다. 한글이 깨질 수 있습니다.
      // 한글 지원을 위해서는 폰트 임베딩이 필수적입니다.
      try {
        const lines = doc.splitTextToSize(text, 180);
        doc.text(lines, 15, 20);
        doc.save('document.pdf');
        alert('PDF 변환 완료! (한글이 깨진다면 콘솔을 확인하세요)');
        console.log("jsPDF는 기본적으로 한글을 지원하지 않습니다. 한글 폰트를 임베드해야 합니다.");
      } catch(e) {
        alert("PDF 생성 중 오류가 발생했습니다: " + e.message);
      }
    }
  </script>
