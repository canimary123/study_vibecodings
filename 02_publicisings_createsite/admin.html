<!DOCTYPE html>

<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
     @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

    * { transition: all 0.3s ease; }

    body {
      background: linear-gradient(135deg, #faf5ff 0%, #fce7f3 50%, #eff6ff 100%);
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

    h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 { font-size: 1.5rem; font-weight: 700; color: #1f2937; }

    input, textarea, select {
      border: 2px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #7C3AED;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .btn-primary {
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      color: white;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      box-shadow: 0 10px 15px rgba(124, 58, 237, 0.3);
      transform: translateY(-2px);
    }
    nav a:hover {
      color: #7C3AED !important;
      background: rgba(124, 58, 237, 0.1);
      border-radius: 0.5rem;
    }
    nav a.active {
      color: #7C3AED !important;
      background: rgba(124, 58, 237, 0.1);
      border-radius: 0.5rem;
    }
  </style>
</head>

      <div class="d-flex justify-content-between align-items-center">
        <!-- 로고 - 홈으로 -->
        <a href="index.html" style="text-decoration: none;">
          <div class="d-flex align-items-center gap-2">
            <span style="font-size: 1.75rem;">⚡</span>
            <h1 style="margin: 0; font-size: 1.5rem;">ToolKit Pro</h1>
          </div>
        </a>
        
        <!-- 메뉴 - 각 페이지로 이동 -->
        <nav class="d-none d-md-flex gap-3">
          <div class="dropdown">
            <a class="dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false" style="color: #6b7280; text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; transition: color 0.3s;">
              도구
            </a>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuLink">
              <li><a class="dropdown-item" href="password-generator.html">🔒 비밀번호</a></li>
              <li><a class="dropdown-item" href="image-converter.html">🖼️ 이미지 변환</a></li>
              <li><a class="dropdown-item" href="image-resize.html">📐 이미지 리사이즈</a></li>
              <li><a class="dropdown-item" href="text-converter.html">📝 텍스트</a></li>
              <li><a class="dropdown-item" href="qr-generator.html">📱 QR코드</a></li>
              <li><a class="dropdown-item" href="word-counter.html">🔢 글자수</a></li>
              <li><a class="dropdown-item" href="youtube-thumbnail.html">🎬 유튜브</a></li>
              <li><a class="dropdown-item" href="json-formatter.html">{} JSON</a></li>
              <li><a class="dropdown-item" href="pdf-converter.html">📄 PDF</a></li>

          </div>
          <a href="admin.html" style="color: #7C3AED; text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; transition: color 0.3s;" class="active">⚙️ 관리자</a>
        </nav>
        
        <div class="d-flex gap-3">
          <span style="color: #6b7280; font-size: 0.875rem;">❤️ 12,847 사용자</span>
        </div>
      </div>
    </div>
  </header>
  
  <main class="container" style="padding: 2rem 0;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0;">제품 관리</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" style="padding: 0.75rem 1.5rem;">새 제품 추가</button>
    </div>

    <!-- Products Table -->
    <div class="card shadow-sm" style="border-radius: 1rem; border: none;">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">이름</th>
                            <th scope="col">카테고리</th>
                            <th scope="col">가격</th>
                            <th scope="col">설명</th>
                            <th scope="col">작업</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <!-- Product rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  </main>

  <!-- Product Modal (for Add/Edit) -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
      <div class="modal-dialog">
          <div class="modal-content" style="border-radius: 1rem;">
              <div class="modal-header" style="border-bottom: none;">
                  <h5 class="modal-title" id="productModalLabel" style="font-weight: 700;">제품 정보</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <form id="product-form">
                      <input type="hidden" id="product-id">
                      <div class="mb-3">
                          <label for="product-name" class="form-label">이름</label>
                          <input type="text" class="form-control" id="product-name" required>
                      </div>
                      <div class="mb-3">
                          <label for="product-category" class="form-label">카테고리</label>
                          <input type="text" class="form-control" id="product-category" required>
                      </div>
                      <div class="mb-3">
                          <label for="product-price" class="form-label">가격</label>
                          <input type="number" class="form-control" id="product-price" required>
                      </div>
                      <div class="mb-3">
                          <label for="product-description" class="form-label">설명</label>
                          <textarea class="form-control" id="product-description" rows="3"></textarea>
                      </div>
                  </form>
              </div>
              <div class="modal-footer" style="border-top: none;">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background: #e5e7eb; color: #4b5563; border: none; border-radius: 0.75rem; padding: 0.75rem 1.5rem;">닫기</button>
                  <button type="submit" form="product-form" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">저장</button>
              </div>
          </div>
      </div>
  </div>
  
  <footer style="background: white; border-top: 1px solid #e5e7eb; margin-top: 4rem; padding: 3rem 0;">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <div class="d-flex align-items-center gap-2 mb-3">

          </div>

        </div>
        <div class="col-md-6">

          <div class="d-flex flex-column gap-2">
            <a href="password-generator.html" style="color: #6b7280; text-decoration: none; font-size: 0.875rem;">비밀번호 생성기</a>

          </div>
        </div>
      </div>
      <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb; color: #9ca3af; font-size: 0.875rem;">
        © 2024 ToolKit Pro. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Admin JS -->
  <script src="admin.js"></script>
</body>
</html>
