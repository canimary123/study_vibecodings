        <div class="col-md-6">

  <script>
    function formatJSON() {
      const input = document.getElementById('jsonInput').value;
      const outputEl = document.getElementById('jsonOutput');
      try {
        const obj = JSON.parse(input);
        const formatted = JSON.stringify(obj, null, 2);
        outputEl.value = formatted;
        outputEl.style.color = '#10b981';
        outputEl.style.borderColor = '#d1fae5';
      } catch (e) {
        outputEl.value = '올바른 JSON 형식이 아닙니다: ' + e.message;
        outputEl.style.color = '#ef4444';
        outputEl.style.borderColor = '#fee2e2';
      }
    }

    function minifyJSON() {
      const input = document.getElementById('jsonInput').value;
      const outputEl = document.getElementById('jsonOutput');
      try {
        const obj = JSON.parse(input);
        const minified = JSON.stringify(obj);
        outputEl.value = minified;
        outputEl.style.color = '#10b981';
        outputEl.style.borderColor = '#d1fae5';
      } catch (e) {
        outputEl.value = '올바른 JSON 형식이 아닙니다: ' + e.message;
        outputEl.style.color = '#ef4444';
        outputEl.style.borderColor = '#fee2e2';
      }
    }

    function validateJSON() {
      const input = document.getElementById('jsonInput').value;
      const outputEl = document.getElementById('jsonOutput');
      try {
        JSON.parse(input);
        alert('✅ 유효한 JSON입니다!');
        outputEl.value = '✅ Valid JSON';
        outputEl.style.color = '#10b981';
        outputEl.style.borderColor = '#d1fae5';
      } catch (e) {
        alert('❌ 유효하지 않은 JSON: ' + e.message);
        outputEl.value = '❌ Invalid JSON: ' + e.message;
        outputEl.style.color = '#ef4444';
        outputEl.style.borderColor = '#fee2e2';
      }
    }
  </script>
