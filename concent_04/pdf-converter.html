  <script>
    // NOTE: The provided jsPDF script does not support Korean characters out-of-the-box.
    // A custom font would need to be embedded for full Korean support.
    // This implementation follows the user's prompt exactly.
    function convertToPDF() {
      const text = document.getElementById('pdfInput').value;
      if (!text.trim()) {
        alert('텍스트를 입력하세요');
        return;
      }
      
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // This part will not render Korean characters correctly without a proper font.
      const lines = doc.splitTextToSize(text, 180); // A4 width in mm is ~210, margins taken into account.
      let y = 20; // Initial y position
      
      lines.forEach(line => {
        if (y > 280) { // Check if new page is needed
          doc.addPage();
          y = 20;
        }
        doc.text(line, 15, y);
        y += 7; // Line height
      });
      
      doc.save('document.pdf');
      alert('PDF 변환이 시작됩니다.');
    }
  </script>
