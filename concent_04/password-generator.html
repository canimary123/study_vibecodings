      <div class="mb-4">

      </div>
      
      <div style="background: linear-gradient(135deg, #faf5ff, #fce7f3); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem;">
        <div class="d-flex justify-content-between align-items-center mb-3"><span style="font-size: 0.875rem; font-weight: 600; color: #374151;">생성된 비밀번호</span><span id="strength" style="font-size: 0.875rem; font-weight: 700; color: #10b981;">보안 강도: 0%</span></div>

      </div>

        <div id="strengthBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.5s ease;"></div>
      </div>
      
      <div class="d-flex gap-3"><button onclick="generatePassword('general')" class="btn-primary" style="flex: 1;">🔄 새로 생성하기</button><button style="background: #3B82F6; color: white; padding: 1rem 1.5rem; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer;">📤 공유</button></div>

  <script>
    function generatePassword(type) {
      const length = parseInt(document.getElementById('pwLength').value);
      const useUpper = document.getElementById('useUpper').checked;
      const useLower = document.getElementById('useLower').checked;
      const useNumber = document.getElementById('useNumber').checked;
      const useSymbol = document.getElementById('useSymbol').checked;
      
      let chars = '';
      if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (useNumber) chars += '0123456789';
      if (useSymbol) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      
      if (chars === '') {
        alert('최소 1개 옵션을 선택하세요');
        return;
      }
      
      let password = '';
      for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      
      document.getElementById('passwordResult').value = password;
      
      let strength = 0;
      if (useUpper) strength += 20;
      if (useLower) strength += 10;
      if (useNumber) strength += 20;
      if (useSymbol) strength += 25;
      if (length >= 12) strength += 15;
      if (length >= 16) strength += 10;
      strength = Math.min(100, strength);
      
      const strengthEl = document.getElementById('strength');
      const strengthBarEl = document.getElementById('strengthBar');

      strengthEl.textContent = '보안 강도: ' + strength + '%';
      strengthBarEl.style.width = strength + '%';
      
      if (strength >= 80) {
        strengthEl.style.color = '#10b981';
        strengthBarEl.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
      } else if (strength >= 50) {
        strengthEl.style.color = '#f59e0b';
        strengthBarEl.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
      } else {
        strengthEl.style.color = '#ef4444';
        strengthBarEl.style.background = 'linear-gradient(90deg, #ef4444, #f87171)';
      }
    }
    
    function copyPassword() {
      const input = document.getElementById('passwordResult');
      if (navigator.clipboard) {
          navigator.clipboard.writeText(input.value).then(() => alert('복사되었습니다!'));
      } else {
          input.select();
          document.execCommand('copy');
          alert('복사되었습니다!');
      }
    }

    document.addEventListener('DOMContentLoaded', () => generatePassword('general'));
  </script>
