    h2 { font-size: 1.5rem; font-weight: 700; color: #1f2937; }

    input, textarea, select {

      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;

    input:focus, textarea:focus, select:focus {

      border-color: #7C3AED;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);

    .btn-primary {
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      color: white;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      border: none;

  <main class="container" style="padding: 2rem 1rem;">
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: #9ca3af; text-decoration: none;">홈</a>
      <span style="color: #d1d5db; margin: 0 0.5rem;">/</span>
      <span style="color: #374151; font-weight: 600;">유튜브 썸네일 추출기</span>
    </div>
    
    <div style="background: white; border-radius: 1.5rem; padding: 3rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
      <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">🎬 유튜브 썸네일 추출기</h1>
      <p style="color: #6b7280; margin-bottom: 2rem;">유튜브 동영상 URL을 입력하여 모든 해상도의 썸네일을 다운로드하세요.</p>
      
      <div class="mb-4">
        <label for="youtubeUrl" style="display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 0.75rem;">유튜브 동영상 URL</label>
        <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      
      <button onclick="extractThumbnail()" class="btn-primary w-100 mb-4">🎬 썸네일 추출</button>

    </div>

        <div class="col-md-4"><a href="image-resize.html" style="text-decoration: none;"><div style="background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05);"><div style="font-size: 2rem; margin-bottom: 0.5rem;">📐</div><h4 style="font-size: 1rem; font-weight: 700; color: #1f2937;">이미지 리사이즈</h4></div></a></div>

    <div class="container">
      <div class="row">
        <div class="col-md-6">

      <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e5e7eb; color: #9ca3af; font-size: 0.875rem;">

      </div>
    </div>
  </footer>
  
  <script>
    function extractThumbnail() {
      const url = document.getElementById('youtubeUrl').value;
      
      let videoId = '';
      if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split(/[?&]/)[0];
      } else if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtube.com/embed/')) {
        videoId = url.split('embed/')[1].split(/[?&]/)[0];
      } else {
        alert('올바른 유튜브 URL을 입력하세요');
        return;
      }
      
      const thumbnails = [
        { name: '최대 해상도 (1280x720)', url: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg` },
        { name: '고화질 (480x360)', url: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` },
        { name: '중화질 (320x180)', url: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` },
        { name: '저화질 (120x90)', url: `https://img.youtube.com/vi/${videoId}/default.jpg` }
      ];
      
      let html = '<div class="row g-4">';
      thumbnails.forEach(thumb => {
        html += `
          <div class="col-md-6">
            <div style="background: #f9fafb; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
              <p style="font-weight: 600; margin-bottom: 0.75rem; color: #374151;">${thumb.name}</p>
              <img src="${thumb.url}" style="width: 100%; border-radius: 0.75rem; margin-bottom: 1rem;" onerror="this.style.display='none'">
              <a href="${thumb.url}" download="${videoId}_${thumb.name.split(' ')[0]}.jpg" class="btn-primary" style="display: inline-block; padding: 0.75rem 1.5rem; text-decoration: none; font-size: 0.875rem;">다운로드</a>
            </div>
          </div>
        `;
      });
      html += '</div>';
      
      document.getElementById('thumbnailResult').innerHTML = html;
      document.getElementById('thumbnailResult').style.display = 'block';
    }
  </script>
</body>
